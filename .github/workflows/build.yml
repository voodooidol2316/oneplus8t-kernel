name: Build OnePlus 8T crDroid Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Maximize Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libelf-dev

    - name: Download Kernel Source
      uses: actions/checkout@v4
      with:
        repository: flyoverhead/crdroid_12_kernel
        ref: 12L-nethunter
        path: kernel

    # Creates directory and cleanly branches out toolchain blocks sequentially
    - name: Download Build Toolchains
      run: |
        mkdir -p toolchain
        git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git -b gcc-master toolchain/gcc64
        git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git -b gcc-master toolchain/gcc32
        git clone --depth=1 https://gitlab.com toolchain/clang
        
    - name: Build Kernel Image
      run: |
        cd kernel
        export PATH=$(pwd)/../toolchain/clang/bin:$(pwd)/../toolchain/gcc64/bin:$(pwd)/../toolchain/gcc32/bin:$PATH
        
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        make O=out vendor/kona-perf_defconfig
        make -j$(nproc --all) O=out

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com AnyKernel
        cd AnyKernel
        rm -rf AnyKernel3
        sed -i 's/device.name1=/device.name1=kebab/g' anykernel.sh
        sed -i 's/device.name2=/device.name2=lemonk/g' anykernel.sh
        
        cp ../kernel/out/arch/arm64/boot/Image.gz-dtb . || cp ../kernel/out/arch/arm64/boot/Image .
        zip -r9 crDroid-12-Kernel-OnePlus8T.zip *

    - name: Upload Flashable Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus8T-Kernel-Zip
        path: AnyKernel/crDroid-12-Kernel-OnePlus8T.zip
